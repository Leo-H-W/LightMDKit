<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>md-view - Markdown Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/theme/github.min.css">
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <span id="folder-label" class="folder-label"></span>
      </div>
      <div class="toolbar-right">
        <button id="btn-new-tab" class="btn" title="在新标签页打开">新tab页</button>
        <select id="file-select" class="file-select">
          <option value="" disabled selected>请先加载文件夹...</option>
          <option value="__LOAD_FOLDER__">&#128193; 加载文件夹...</option>
        </select>
        <button id="btn-back" class="btn" title="返回上一个文档" disabled>← 返回</button>
        <button id="btn-refresh" class="btn" title="刷新当前文件">刷新</button>
        <button id="btn-edit" class="btn" title="编辑当前文件">编辑</button>
        <span id="status" class="status"></span>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="resize-handle" title="拖动调整宽度"></div>
        <div class="sidebar-header">
          <span class="sidebar-title">目录</span>
          <button id="btn-toggle-toc" class="btn-toggle" title="隐藏目录">&#9664;</button>
        </div>
        <nav id="toc" class="toc">
          <p class="toc-empty">暂无内容，请先加载文件夹</p>
        </nav>
      </aside>

      <div class="content-wrapper">
        <div class="content-scroll">
          <article id="content" class="markdown-body">
          <div class="empty-state">
            <p>从右上角下拉框选择 <strong>"📁 加载文件夹..."</strong> 来加载 Markdown 文件</p>
          </div>
        </article>
        <textarea id="editor" class="markdown-editor" style="display:none;" spellcheck="false"></textarea>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5/addon/mode/overlay.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/markdown/markdown.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/gfm/gfm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="md-render.js?v=3"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
